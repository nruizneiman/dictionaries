name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilar scripts (detecta errores de sintaxis)
        run: |
          python -m py_compile alfanum.py
          python -m py_compile generadores/*.py

      - name: Validar listas (.txt)
        run: python validar_listas.py
